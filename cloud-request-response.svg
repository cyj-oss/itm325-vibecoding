<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" role="img" aria-labelledby="title desc">
  <title id="title">A browser requests files and a web server responds</title>
  <desc id="desc">First, a visitor's browser requests your page. Second, the web server sends the HTML, CSS, and JavaScript files. Third, the browser uses those files to display the page and run the Pomodoro timer.</desc>
  <defs>
    <marker id="request-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 7 4.5 1 8" fill="none" stroke="#1457bf" stroke-width="1.7"/></marker>
    <marker id="response-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 7 4.5 1 8" fill="none" stroke="#176343" stroke-width="1.7"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#20242b">
    <text x="20" y="43" font-size="28" font-weight="700">Browser asks. Server responds.</text>
    <rect x="20" y="82" width="190" height="256" rx="12" fill="#edf4ff" stroke="#bfd2ef" stroke-width="2"/>
    <text x="115" y="123" text-anchor="middle" font-size="26" font-weight="600">Visitor's</text>
    <text x="115" y="155" text-anchor="middle" font-size="26" font-weight="600">browser</text>
    <rect x="46" y="181" width="138" height="82" rx="7" fill="#fff" stroke="#9bbcea" stroke-width="2"/>
    <path d="M46 200H184" stroke="#9bbcea" stroke-width="2"/>
    <circle cx="58" cy="191" r="3" fill="#9bbcea"/>
    <text x="115" y="242" text-anchor="middle" font-size="30" font-weight="600" fill="#1457bf">25:00</text>
    <text x="115" y="296" text-anchor="middle" font-size="24">The timer</text>
    <text x="115" y="325" text-anchor="middle" font-size="24">runs here.</text>

    <text x="320" y="123" text-anchor="middle" font-size="26" font-weight="600" fill="#1457bf">1 Request</text>
    <text x="320" y="154" text-anchor="middle" font-size="24" fill="#1457bf">Send the page.</text>
    <path d="M230 180H408" stroke="#1457bf" stroke-width="2.5" fill="none" marker-end="url(#request-arrow)"/>

    <text x="320" y="238" text-anchor="middle" font-size="26" font-weight="600" fill="#176343">2 Response</text>
    <text x="320" y="269" text-anchor="middle" font-size="24" fill="#176343">The page files</text>
    <path d="M410 296H232" stroke="#176343" stroke-width="2.5" fill="none" marker-end="url(#response-arrow)"/>

    <rect x="430" y="82" width="190" height="256" rx="12" fill="#f4f9f6" stroke="#b7d5c5" stroke-width="2"/>
    <text x="525" y="125" text-anchor="middle" font-size="26" font-weight="600">Web server</text>
    <rect x="454" y="150" width="142" height="44" rx="7" fill="#fff" stroke="#b7d5c5"/>
    <text x="525" y="180" text-anchor="middle" font-size="25">HTML</text>
    <rect x="454" y="210" width="142" height="44" rx="7" fill="#fff" stroke="#b7d5c5"/>
    <text x="525" y="240" text-anchor="middle" font-size="25">CSS</text>
    <rect x="454" y="270" width="142" height="44" rx="7" fill="#fff" stroke="#b7d5c5"/>
    <text x="525" y="300" text-anchor="middle" font-size="25">JavaScript</text>

    <rect x="20" y="370" width="600" height="82" rx="12" fill="#f6f7f9"/>
    <text x="320" y="403" text-anchor="middle" font-size="26" font-weight="600">3 The browser displays the page.</text>
    <text x="320" y="435" text-anchor="middle" font-size="24" fill="#5b6470">HTML + CSS + JavaScript</text>
  </g>
</svg>
