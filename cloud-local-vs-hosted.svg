<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" role="img" aria-labelledby="title desc">
  <title id="title">From a local file to a public website</title>
  <desc id="desc">Before deployment, your browser opens files on your own laptop. After you upload a copy to Netlify, visitors can open the hosted website using its web address.</desc>
  <defs>
    <marker id="gray-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 7 4.5 1 8" fill="none" stroke="#667085" stroke-width="1.7"/></marker>
    <marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 7 4.5 1 8" fill="none" stroke="#1457bf" stroke-width="1.7"/></marker>
  </defs>
  <rect width="640" height="520" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#20242b">
    <rect x="16" y="16" width="608" height="216" rx="14" fill="#f6f7f9"/>
    <text x="40" y="56" font-size="28" font-weight="700">Before: on your laptop</text>
    <rect x="40" y="82" width="204" height="96" rx="9" fill="#fff" stroke="#c4ccd7" stroke-width="2"/>
    <text x="142" y="123" text-anchor="middle" font-size="26" font-weight="600">Your files</text>
    <text x="142" y="157" text-anchor="middle" font-size="24" fill="#5b6470">HTML, CSS, JS</text>
    <text x="308" y="113" text-anchor="middle" font-size="24" fill="#5b6470">open</text>
    <path d="M264 138H350" stroke="#667085" stroke-width="2.5" fill="none" marker-end="url(#gray-arrow)"/>
    <rect x="376" y="82" width="224" height="96" rx="9" fill="#fff" stroke="#c4ccd7" stroke-width="2"/>
    <path d="M376 104H600" stroke="#c4ccd7" stroke-width="2"/>
    <circle cx="392" cy="93" r="3" fill="#8b95a4"/><circle cx="404" cy="93" r="3" fill="#8b95a4"/>
    <text x="488" y="148" text-anchor="middle" font-size="26" font-weight="600">Your browser</text>
    <text x="40" y="212" font-size="25" fill="#5b6470">A folder path is not a public web address.</text>

    <rect x="16" y="256" width="608" height="248" rx="14" fill="#edf4ff"/>
    <text x="40" y="297" font-size="28" font-weight="700">After: hosted on Netlify</text>
    <rect x="40" y="322" width="204" height="112" rx="9" fill="#fff" stroke="#9bbcea" stroke-width="2"/>
    <text x="142" y="365" text-anchor="middle" font-size="28" font-weight="600">Netlify</text>
    <text x="142" y="403" text-anchor="middle" font-size="24" fill="#1457bf">Your site's files</text>
    <text x="308" y="359" text-anchor="middle" font-size="24" fill="#1457bf">HTTPS</text>
    <path d="M264 384H350" stroke="#1457bf" stroke-width="2.5" fill="none" marker-end="url(#blue-arrow)"/>
    <rect x="376" y="322" width="224" height="112" rx="9" fill="#fff" stroke="#9bbcea" stroke-width="2"/>
    <path d="M376 346H600" stroke="#9bbcea" stroke-width="2"/>
    <circle cx="392" cy="334" r="3" fill="#1457bf"/><circle cx="404" cy="334" r="3" fill="#1457bf"/>
    <text x="488" y="381" text-anchor="middle" font-size="26" font-weight="600">Visitors'</text>
    <text x="488" y="413" text-anchor="middle" font-size="26" font-weight="600">browsers</text>
    <text x="40" y="478" font-size="25" fill="#1457bf">Share a web address so others can visit.</text>
  </g>
</svg>
