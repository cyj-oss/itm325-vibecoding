<title id="title">Students connect to schools through a foreign key</title>
<desc id="desc">The Student table has a school_id foreign key referencing the School table's unique id. Jordan, Maya, and Olivia use school_id 0, which refers to Pacific University. Ethan uses 1 for Mountain College. Noah uses 2 for Bayside University.</desc>
